<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roshan's Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="calculator">
        <!-- App Title -->
        <h1 class="calc-title">Roshan's Calculator</h1>

        <!-- Display Screen -->
        <input type="text" id="display" readonly placeholder="0">

        <!-- Calculator Buttons Grid -->
        <div class="buttons">
            <button class="btn-action" onclick="clearDisplay()">C</button>
            <button class="btn-action" onclick="deleteChar()">DEL</button>
            <button class="btn-op" onclick="appendValue('/')">/</button>
            <button class="btn-op" onclick="appendValue('*')">*</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="btn-op" onclick="appendValue('-')">-</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="btn-op" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="btn-equal" onclick="calculate()">=</button>

            <button class="btn-zero" onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
